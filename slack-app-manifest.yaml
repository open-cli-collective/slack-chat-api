display_information:
  name: Slack Chat API
  description: Command-line interface for Slack Chat API
  background_color: "#4A154B"

features:
  bot_user:
    display_name: Slack Chat API
    always_online: false

oauth_config:
  scopes:
    bot:
      - channels:history
      - channels:manage
      - channels:read
      - chat:write
      - emoji:read
      - files:read
      - groups:history
      - groups:read
      - reactions:write
      - team:read
      - users:read
    user:
      - search:read

settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
